groups:
  - name: erp-system
    rules:
      - alert: ErpInstanceDown
        expr: up{job="erp-system"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "ERP instance is down"

      - alert: ErpHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="erp-system",status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{job="erp-system"}[5m])) > 0.02
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "More than 2% of requests are failing with 5xx"

      - alert: ErpSlowRequests
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket{job="erp-system"}[5m])) by (le)) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "95th percentile latency is above 500 ms"

      - alert: ErpDbPoolExhausted
        expr: hikaricp_connections_pending{job="erp-system"} > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Requests are waiting for a database connection"
