# Production profile: PostgreSQL, no demo data, no default secrets.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 10000
  jpa:
    hibernate:
      # Known limitation: schema is generated by Hibernate. Replace with Flyway migrations + "validate".
      ddl-auto: update

erp:
  security:
    jwt-secret: ${ERP_JWT_SECRET}
    admin-password: ${ERP_ADMIN_PASSWORD}
    manager-password: ${ERP_MANAGER_PASSWORD}
    user-password: ${ERP_USER_PASSWORD}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    com.erp: INFO
    org.hibernate.SQL: WARN
