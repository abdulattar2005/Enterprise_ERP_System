spring:
  application:
    name: erp-system
  profiles:
    default: dev
  datasource:
    url: jdbc:h2:mem:erp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  cache:
    type: caffeine
    cache-names: products
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=5m
  jackson:
    default-property-inclusion: non_null

erp:
  security:
    # Development defaults ONLY. Production must override all four via environment variables.
    jwt-secret: ${ERP_JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes!}
    token-ttl-minutes: ${ERP_TOKEN_TTL_MINUTES:60}
    admin-password: ${ERP_ADMIN_PASSWORD:admin123}
    manager-password: ${ERP_MANAGER_PASSWORD:manager123}
    user-password: ${ERP_USER_PASSWORD:user123}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n"
  level:
    com.erp: INFO
